name: Atualizar dívida pública

on:
  schedule:
    - cron: "17 13 * * *"   # todo dia às 10:17 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: atualizar-divida
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Coletar no Banco Central e montar o site
        run: python atualizar.py
      - name: Publicar
        if: always()
        run: |
          git config user.name  "robo-quanto-custa"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p docs/dados
          git add docs/dados
          if ! git diff --cached --quiet; then
            git commit -m "dívida: dados de $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main || true
              if git push; then break; fi
              echo "Envio recusado; nova tentativa em $((i*20)) s"; sleep $((i*20))
              [ $i = 5 ] && exit 1
            done
          fi
